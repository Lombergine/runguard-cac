<!--
  RunGuard App Store mark — source of truth for assets/icon.png.

  Flat, two colours, no gradient, no shadow, no construction guides: the same
  printed character as the app itself. Colours are the app's own tokens
  (src/theme/tokens.ts) — `color.accent` #2C4C8C on `color.bg` #F3F5F4.

  The subject is the placeholder's chevron, redrawn as a single solid peak:
  mitred at the apex, cut square at the arm ends, 160 units thick measured
  perpendicular to the arm. Its box is 600x479 on a 1024 canvas, so the mark
  clears the iOS corner mask with room to spare and still holds together at
  40px. The apex sits above the box centre because the mass is in the arms —
  the polygon's centroid, not its bounding box, is what the eye centres on.

  To re-rasterise: the polygon below is the only geometry. Render at 1024x1024
  RGB with NO alpha channel (App Store validation rejects alpha, and rejects
  any size other than 1024x1024), then run `node scripts/check-assets.mjs`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#F3F5F4"/>
  <polygon fill="#2C4C8C" points="512,262 212,642 337.581,741.143 512,520.213 686.419,741.143 812,642"/>
</svg>
